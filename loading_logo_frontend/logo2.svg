<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480">
  <defs>
    <!-- The clipPath masks the trunk line so it fuses EXACTLY with the inner edge of the shield -->
    <clipPath id="shield-clip">
      <path d="M 22 40 L 178 40 L 178 88 C 178 160, 126 220, 100 230 C 74 220, 22 160, 22 88 Z" />
    </clipPath>
  </defs>

  <!-- Shield Outline -->
  <path d="M 22 40 L 178 40 L 178 88 C 178 160, 126 220, 100 230 C 74 220, 22 160, 22 88 Z" 
        fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Group clipped to shield boundary -->
  <g clip-path="url(#shield-clip)">
    <!-- Central River Y (Single Line) -->
    <!-- Left Branch (2 Wavelengths) -->
    <path d="M 22 40 
             C 30 70, 50 40, 61 72.5 
             C 70 100, 90 70, 100 105" 
          fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
          
    <!-- Right Branch (2 Wavelengths) -->
    <path d="M 178 40 
             C 170 70, 150 40, 139 72.5 
             C 130 100, 110 70, 100 105" 
          fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
          
    <!-- Main Trunk (Serpentine Center Line) -->
    <path d="M 100 105 
             C 100 120, 90 120, 90 135 
             C 90 150, 110 150, 110 165 
             C 110 180, 90 180, 90 195 
             C 90 210, 110 210, 110 225 
             C 110 240, 90 240, 90 255" 
          fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
