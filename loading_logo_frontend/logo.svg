<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="400" height="480">
  <defs>
    <!-- The clipPath perfectly masks the trunk lines so they fuse EXACTLY with the inner edge of the shield -->
    <clipPath id="shield-clip">
      <path d="M 40 40 L 160 40 L 160 88 C 160 160, 120 220, 100 230 C 80 220, 40 160, 40 88 Z" />
    </clipPath>
  </defs>

  <!-- Shield Outline -->
  <path d="M 40 40 L 160 40 L 160 88 C 160 160, 120 220, 100 230 C 80 220, 40 160, 40 88 Z" 
        fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Group clipped to shield boundary so trunks perfectly touch the edge without overlapping -->
  <g clip-path="url(#shield-clip)">
    <!-- Top V (Inner arms of the Y) - 2 Wavelengths -->
    <path d="M 40 40 C 45 60, 55 40, 65 55 C 75 70, 85 50, 100 75" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 160 40 C 155 60, 145 40, 135 55 C 125 70, 115 50, 100 75" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left Outer Arm and Stem - 2 Wavelengths (shifted for 30% wider channel) -->
    <path d="M 40 70 
             C 45 90, 55 70, 65 85 
             C 75 100, 80 85, 87 105 
             C 87 120, 77 120, 77 135 
             C 77 150, 97 150, 97 165 
             C 97 180, 77 180, 77 195 
             C 77 210, 97 210, 97 225 
             C 97 240, 77 240, 77 255" 
          fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
          
    <!-- Right Outer Arm and Stem - Mathematically translated by +26 on X-axis (30% wider) -->
    <path d="M 160 70 
             C 155 90, 145 70, 135 85 
             C 125 100, 120 85, 113 105 
             C 113 120, 103 120, 103 135 
             C 103 150, 123 150, 123 165 
             C 123 180, 103 180, 103 195 
             C 103 210, 123 210, 123 225 
             C 123 240, 103 240, 103 255" 
          fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
