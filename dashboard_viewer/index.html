<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Forensics // Media Intelligence Digest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1c1c1c;
            --accent-orange: #ff5c00;
            --accent-orange-hover: #e05200;
            --text-main: #ffffff;
            --text-muted: #8e8e8e;
            --border-color: #242424;
            --border-light: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Strict AlphaSignal Brutalist Rule */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Technical Blueprint Grid Layout */
        #sidebar {
            width: 320px;
            flex-shrink: 0;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-base);
        }

        .sidebar-header h2 {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .sidebar-header span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-orange);
            font-weight: 700;
        }

        #state-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .zone-header {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 18px 20px 8px 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .zone-header:hover { color: var(--text-main); }

        .zone-content { display: none; }
        .zone-content.open { display: block; }

        .state-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-left: 2px solid transparent;
            padding: 10px 20px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .state-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border-left-color: var(--border-light);
        }

        .state-btn.active {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border-left-color: var(--accent-orange);
            font-weight: 600;
        }

        .state-badges {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-count {
            background-color: var(--bg-card);
            color: var(--text-muted);
            padding: 2px 6px;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border-color);
        }

        .badge-mi {
            padding: 2px 5px;
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .mi-urban { background-color: var(--accent-orange); color: #000; }
        .mi-hinterland { background-color: var(--bg-card); color: #fff; border: 1px solid var(--text-muted); }
        .mi-normal { background-color: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-color); }

        /* Main Editorial Content Column */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-base);
            overflow-y: auto;
            padding: 36px 48px;
        }

        #dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-meta-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-orange);
            margin-bottom: 8px;
            display: block;
            font-weight: 700;
        }

        #view-title {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.1;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-bar label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .filter-bar input[type="date"] {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color-scheme: dark;
        }

        .btn-action {
            background-color: var(--accent-orange);
            color: #000000;
            border: 1px solid var(--accent-orange);
            padding: 8px 18px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: background 0.1s ease;
        }

        .btn-action:hover { background-color: var(--accent-orange-hover); }
        
        .btn-secondary {
            background-color: var(--bg-base);
            color: var(--text-main);
            border-color: var(--border-light);
        }
        .btn-secondary:hover { background-color: var(--bg-surface); border-color: var(--text-muted); }

        /* Technical KPI Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background-color: var(--border-color);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .kpi-card {
            background-color: var(--bg-base);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            line-height: 1;
        }

        .kpi-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .maf-banner {
            margin: 24px 0;
            padding: 24px 32px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-orange);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .maf-banner-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 0.15em;
        }

        .maf-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .maf-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .maf-bucket { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .maf-val { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }

        /* Editorial Digest List */
        #cluster-container {
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
        }

        .cluster-card {
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-base);
            padding: 36px 0;
            transition: background 0.1s ease;
        }

        .cluster-card:hover { background-color: var(--bg-surface); }

        .cluster-header {
            padding: 12px 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cluster-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 32px;
        }

        .cluster-headline {
            font-family: 'Inter', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .cluster-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .metric-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .pill-reports { color: var(--text-main); border-color: var(--border-light); }
        .pill-diversity { color: var(--text-muted); }
        .pill-saturation-high { background-color: var(--accent-orange); color: #000; border-color: var(--accent-orange); }
        .pill-originator { color: var(--accent-orange); border-color: rgba(255, 92, 0, 0.3); }

        .thread-badge {
            background-color: var(--accent-orange);
            color: #000000;
            padding: 6px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: inline-flex;
            align-items: center;
        }

        /* Accordion Expansion */
        .cluster-body {
            display: none;
            padding: 28px 24px 12px 24px;
            border-top: 1px dashed var(--border-color);
            margin-top: 20px;
        }

        .cluster-body.open { display: block; }

        .article-list { list-style: none; display: flex; flex-direction: column; }

        .article-item {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .article-item:last-child { border-bottom: none; }

        .article-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.98rem;
            font-weight: 400;
            line-height: 1.45;
            transition: color 0.1s ease;
        }

        .article-link:hover { color: var(--accent-orange); }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .domain-tag {
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* AlphaSignal Evolving Timeline Block */
        .child-thread-container {
            margin-top: 36px;
            padding: 32px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-orange);
        }

        .child-thread-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .child-cluster {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .child-cluster:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

        .child-headline {
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .child-phase-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent-orange);
            margin-right: 8px;
        }

        .empty-state {
            padding: 80px 20px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>OSINT Forensics</h2>
            <span>Intelligence Engine</span>
        </div>
        <div id="state-list">
            <p style="color: var(--text-muted); padding: 20px; font-family:'JetBrains Mono', monospace; font-size:0.8rem;">LOADING DATA...</p>
        </div>
    </div>

    <div id="main-content">
        <div id="dashboard-header">
            <div>
                <span class="header-meta-tag">// MACRO TELEMETRY DIGEST</span>
                <h1 id="view-title">National Intelligence</h1>
            </div>
            <div class="filter-bar">
                <label for="start-date">FROM</label>
                <input type="date" id="start-date">
                <label for="end-date">TO</label>
                <input type="date" id="end-date">
                <button id="apply-filter" class="btn-action">Filter</button>
                <button id="clear-filter" class="btn-action btn-secondary">Reset</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="kpi-card">
                <div class="kpi-title">SCRAPED ARTICLES</div>
                <div class="kpi-value" id="stat-reports">-</div>
                <div class="kpi-sub">Matching keyword vectors</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">DISTINCT INCIDENTS</div>
                <div class="kpi-value" id="stat-clusters">-</div>
                <div class="kpi-sub">Deduplicated narrative events</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">MEGAPHONE INDEX (MI)</div>
                <div class="kpi-value" id="stat-mi">-</div>
                <div class="kpi-sub" id="mi-desc">Avg volume per incident</div>
            </div>
        </div>

        <div id="maf-bias-banner" class="maf-banner" style="display:none;"></div>

        <div id="cluster-container">
            <div class="empty-state">SELECT A REGION TO INITIALIZE FORENSIC DIGEST</div>
        </div>
    </div>

    <script>
        let dashboardData = null;
        let biasMetrics = null;
        let currentState = 'All Locations';

        const ZONE_MAPPING = {
            "North West": ["Kaduna", "Kano", "Katsina", "Kebbi", "Jigawa", "Sokoto", "Zamfara"],
            "North East": ["Adamawa", "Bauchi", "Borno", "Gombe", "Taraba", "Yobe"],
            "North Central": ["Benue", "Kogi", "Kwara", "Nasarawa", "Niger", "Plateau", "FCT"],
            "South West": ["Ekiti", "Lagos", "Ogun", "Ondo", "Osun", "Oyo"],
            "South East": ["Abia", "Anambra", "Ebonyi", "Enugu", "Imo"],
            "South South": ["Akwa Ibom", "Bayelsa", "Cross River", "Delta", "Edo", "Rivers"]
        };

        const BROAD_REGIONS = ["The North", "The South", "The East", "The West", "Middle Belt", "National / General Nigerian", "Abroad / International"];

        function renderBiasBanner(bData) {
            const banner = document.getElementById('maf-bias-banner');
            if (!bData || !bData['Elite/VIP'] || !bData['Kinetic/Rural']) return;

            const elite = bData['Elite/VIP'];
            const kinetic = bData['Kinetic/Rural'];
            const gen = bData['Other/General'] || {avg_reach:0, avg_lifespan_hours:0};

            const lifeSkew = kinetic.avg_lifespan_hours > 0 ? Math.round(((elite.avg_lifespan_hours - kinetic.avg_lifespan_hours) / kinetic.avg_lifespan_hours) * 100) : 0;
            const reachSkew = kinetic.avg_reach > 0 ? Math.round(((elite.avg_reach - kinetic.avg_reach) / kinetic.avg_reach) * 100) : 0;

            banner.innerHTML = `
                <div class="maf-banner-title">// EXECUTIVE MACRO-ATTENTION FINGERPRINT (MAF) // SYSTEMIC VIP MEDIA BIAS SKEW</div>
                <div class="maf-grid">
                    <div class="maf-item">
                        <span class="maf-bucket">ELITE / VIP PATRIARCHS (${elite.count})</span>
                        <span class="maf-val">${elite.avg_reach} ART // ${elite.avg_domains} DOM // ${elite.avg_lifespan_hours}H LIFE</span>
                    </div>
                    <div class="maf-item">
                        <span class="maf-bucket">KINETIC / RURAL MASSACRES (${kinetic.count})</span>
                        <span class="maf-val">${kinetic.avg_reach} ART // ${kinetic.avg_domains} DOM // ${kinetic.avg_lifespan_hours}H LIFE</span>
                    </div>
                    <div class="maf-item" style="border-left: 1px solid var(--border-color); padding-left: 20px;">
                        <span class="maf-bucket">ATTENTION SKEW DISPARITY</span>
                        <span class="maf-val" style="color: var(--accent-orange);">+${lifeSkew}% LIFESPAN // +${reachSkew}% REACH SKEW</span>
                    </div>
                </div>
            `;
            banner.style.display = 'flex';
        }

        async function loadDashboardData() {
            try {
                const res = await fetch('clusters.json');
                if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                dashboardData = await res.json();
                initSidebar();

                try {
                    const bRes = await fetch('bias_metrics.json');
                    if (bRes.ok) {
                        biasMetrics = await bRes.json();
                        renderBiasBanner(biasMetrics);
                    }
                } catch(be) {}
            } catch (err) {
                console.error("Fetch error", err);
                document.getElementById('state-list').innerHTML = `<div style="color:var(--accent-orange); padding: 20px; font-family:'JetBrains Mono', monospace; font-size:0.8rem;">[ERROR] FAILED TO LOAD CLUSTERS.JSON. LAUNCH VIA HTTP SERVER.</div>`;
            }
        }

        function formatMIBadge(mi) {
            if (mi === undefined || mi === null) return '';
            let pillClass = 'mi-normal';
            if (mi >= 5.0) pillClass = 'mi-urban';
            else if (mi <= 1.5) pillClass = 'mi-hinterland';
            return `<span class="badge-mi ${pillClass}">MI:${mi}</span>`;
        }

        function createLocationButton(label, stateKey) {
            const data = dashboardData.states[stateKey];
            if (!data || data.total_clusters === 0) return null;

            const btn = document.createElement('button');
            btn.className = 'state-btn';
            btn.dataset.location = stateKey;
            
            btn.innerHTML = `
                <span>${label}</span>
                <div class="state-badges">
                    ${formatMIBadge(data.megaphone_index)}
                    <span class="badge-count">${data.total_clusters}</span>
                </div>
            `;

            btn.onclick = (e) => {
                document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                renderLocation(stateKey);
            };

            return btn;
        }

        function initSidebar() {
            document.getElementById('apply-filter').addEventListener('click', () => renderLocation(currentState));
            document.getElementById('clear-filter').addEventListener('click', () => {
                document.getElementById('start-date').value = '';
                document.getElementById('end-date').value = '';
                renderLocation(currentState);
            });

            const sidebar = document.getElementById('state-list');
            sidebar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'state-btn active';
            allBtn.innerHTML = `<span>ALL LOCATIONS</span> <span class="badge-count">${dashboardData.metadata.total_clusters}</span>`;
            allBtn.onclick = () => {
                document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                renderLocation('All Locations');
            };
            sidebar.appendChild(allBtn);

            for (const [zone, states] of Object.entries(ZONE_MAPPING)) {
                const hasData = dashboardData.states[zone] || states.some(s => dashboardData.states[s]);
                if (!hasData) continue;

                const zHeader = document.createElement('div');
                zHeader.className = 'zone-header';
                zHeader.innerHTML = `<span>// ${zone}</span> <span>[+]</span>`;

                const zContent = document.createElement('div');
                zContent.className = 'zone-content';

                zHeader.onclick = () => {
                    zContent.classList.toggle('open');
                    zHeader.querySelector('span:last-child').innerText = zContent.classList.contains('open') ? '[-]' : '[+]';
                };

                sidebar.appendChild(zHeader);
                sidebar.appendChild(zContent);

                const genBtn = createLocationButton(`GENERAL ${zone.toUpperCase()}`, zone);
                if (genBtn) zContent.appendChild(genBtn);

                states.forEach(st => {
                    const stBtn = createLocationButton(st.toUpperCase(), st);
                    if (stBtn) zContent.appendChild(stBtn);
                });
            }

            const bHeader = document.createElement('div');
            bHeader.className = 'zone-header';
            bHeader.style.marginTop = '12px';
            bHeader.innerText = '// MACRO & ABROAD';
            sidebar.appendChild(bHeader);

            BROAD_REGIONS.forEach(reg => {
                const b = createLocationButton(reg.toUpperCase(), reg);
                if (b) sidebar.appendChild(b);
            });

            renderLocation('All Locations');
        }

        function cleanDomain(raw) {
            if (!raw) return 'UNKNOWN';
            let s = raw.toLowerCase();
            s = s.replace(/^manual_/, '').replace(/_api_.*$/, '').replace(/_rss_.*$/, '').replace(/_deep.*$/, '').replace(/_scraper.*$/, '');
            return s.toUpperCase();
        }

        function renderArticleList(articles) {
            return articles.map(art => `
                <li class="article-item">
                    <a href="${art.url}" target="_blank" class="article-link">${art.title}</a>
                    <div class="article-meta">
                        <span class="domain-tag">${cleanDomain(art.source)}</span>
                        <span>${art.date.split(' ')[0]}</span>
                    </div>
                </li>
            `).join('');
        }

        function renderLocation(locKey) {
            currentState = locKey;
            document.getElementById('view-title').innerText = locKey.toUpperCase();
            const container = document.getElementById('cluster-container');
            container.innerHTML = '';

            let rawClusters = [];
            let locMI = null;

            if (locKey === 'All Locations') {
                Object.values(dashboardData.states).forEach(st => {
                    rawClusters = rawClusters.concat(JSON.parse(JSON.stringify(st.clusters)));
                });
            } else {
                const st = dashboardData.states[locKey];
                if (st) {
                    rawClusters = JSON.parse(JSON.stringify(st.clusters));
                    locMI = st.megaphone_index;
                }
            }

            const startStr = document.getElementById('start-date').value;
            const endStr = document.getElementById('end-date').value;

            let filtered = [];
            let totalReportsCount = 0;

            rawClusters.forEach(c => {
                if (startStr || endStr) {
                    c.articles = c.articles.filter(a => {
                        const d = a.date.split(' ')[0];
                        if (startStr && d < startStr) return false;
                        if (endStr && d > endStr) return false;
                        return true;
                    });
                }
                if (c.articles.length > 0) {
                    c.report_count = c.articles.length;
                    filtered.push(c);
                    totalReportsCount += c.report_count;
                }
            });

            document.getElementById('stat-reports').innerText = totalReportsCount;
            document.getElementById('stat-clusters').innerText = filtered.length;
            
            if (locMI !== null) {
                document.getElementById('stat-mi').innerText = locMI;
                document.getElementById('mi-desc').innerText = locMI >= 5.0 ? 'URBAN SYNDICATION SKEW' : (locMI <= 1.5 ? 'HINTERLAND ISOLATION' : 'BALANCED ATTENTION RATIO');
            } else {
                const calcMI = (totalReportsCount / Math.max(1, filtered.length)).toFixed(2);
                document.getElementById('stat-mi').innerText = calcMI;
                document.getElementById('mi-desc').innerText = 'AGGREGATE NATIONAL RATIO';
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">NO NARRATIVE EVENTS RECORDED WITHIN SPECIFIED BOUNDS.</div>`;
                return;
            }

            const clusterLookup = {};
            filtered.forEach(c => clusterLookup[c.cluster_id] = c);

            const topLevelClusters = [];
            
            filtered.forEach(c => {
                if (c.parent_cluster_id && clusterLookup[c.parent_cluster_id]) return;
                topLevelClusters.push(c);
            });

            topLevelClusters.sort((a,b) => b.report_count - a.report_count);

            topLevelClusters.forEach(cluster => {
                const card = document.createElement('div');
                card.className = 'cluster-card';

                const childObjs = (cluster.child_cluster_ids || []).map(id => clusterLookup[id]).filter(Boolean);
                const hasChildren = childObjs.length > 0;

                const header = document.createElement('div');
                header.className = 'cluster-header';

                let satPillClass = '';
                if (cluster.saturation_ratio > 2.0) satPillClass = 'pill-saturation-high';

                header.innerHTML = `
                    <div class="cluster-top-row">
                        <div class="cluster-headline">${cluster.rep_title}</div>
                        <div style="font-family:'JetBrains Mono', monospace; font-size:0.8rem; color:var(--text-muted);">[EXPAND]</div>
                    </div>
                    <div class="cluster-metrics">
                        <span class="metric-pill pill-reports">${cluster.report_count} REPORTS</span>
                        <span class="metric-pill pill-diversity">${cluster.distinct_domains_count} DOMAINS</span>
                        <span class="metric-pill ${satPillClass}">SATURATION:${cluster.saturation_ratio}</span>
                        <span class="metric-pill">LIFESPAN:${cluster.lifespan_hours}H</span>
                        <span class="metric-pill pill-originator">FIRST:${cleanDomain(cluster.originator)}</span>
                        ${hasChildren ? `<span class="thread-badge">// THREAD: ${childObjs.length + 1} PHASES</span>` : ''}
                    </div>
                `;

                const body = document.createElement('div');
                body.className = 'cluster-body';

                let bodyHTML = `<ul class="article-list">${renderArticleList(cluster.articles)}</ul>`;

                if (hasChildren) {
                    bodyHTML += `
                        <div class="child-thread-container">
                            <div class="child-thread-title">// NARRATIVE EVOLUTION TIMELINE (${childObjs.length} FOLLOW-UP CYCLES)</div>
                            ${childObjs.map((child, idx) => `
                                <div class="child-cluster">
                                    <div class="child-headline"><span class="child-phase-tag">[PHASE ${idx+2}]</span>${child.rep_title}</div>
                                    <div style="font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--text-muted); margin-bottom:12px;">
                                        [+${child.report_count} REPORTS] &nbsp; [FIRST: ${cleanDomain(child.originator)}] &nbsp; [${child.most_recent_date}]
                                    </div>
                                    <ul class="article-list">${renderArticleList(child.articles)}</ul>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                body.innerHTML = bodyHTML;

                header.onclick = () => {
                    body.classList.toggle('open');
                    header.querySelector('.cluster-top-row div:last-child').innerText = body.classList.contains('open') ? '[COLLAPSE]' : '[EXPAND]';
                };

                card.appendChild(header);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        loadDashboardData();
    </script>
</body>
</html>
